name: Apply issue 37 patch

on:
  push:
    branches:
      - agent/issue-37-prewriter-executor

permissions:
  contents: write

concurrency:
  group: apply-issue-37
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Apply verified patch and finalize branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f .agent-patches/issue37/ready
          cat .agent-patches/issue37/part-[0-9][0-9] > /tmp/issue37.patch.gz.b64
          echo "755b29cb93288de4b42a1781b6c97cb1f46036bfd7f7b7e32eb5e963194ad002  /tmp/issue37.patch.gz.b64" | sha256sum --check -
          base64 --decode /tmp/issue37.patch.gz.b64 > /tmp/issue37.patch.gz
          echo "bfad250aeff628a1693e6c3baa674362423651b396e1ad4e612a060b9de6524f  /tmp/issue37.patch.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/issue37.patch.gz > /tmp/issue37.patch
          echo "0a5b7a45a1e16b41c0aed3338cfd0fa83d111b67f997e5fc1d9eb9935cfb1d2e  /tmp/issue37.patch" | sha256sum --check -
          git apply --check --whitespace=error-all /tmp/issue37.patch
          git apply --index --whitespace=error-all /tmp/issue37.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Execute lifecycle pre-writer stages through production boundaries"
          CODE_COMMIT="$(git rev-parse HEAD)"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$CODE_COMMIT" node scripts/build-manifest.mjs
          git rm -r .agent-patches/issue37
          git rm .github/workflows/agent-apply-issue37.yml
          git add manifest.json
          git commit -m "Rebuild pre-writer executor manifest"
          git push origin "HEAD:${TARGET_BRANCH}"
