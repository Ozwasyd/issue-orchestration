name: Apply issue 39 patch

on:
  push:
    branches:
      - agent/issue-39-observe-only-executor
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-issue-39
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/issue-39-observe-only-executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Apply verified patch and finalize branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -d .agent-patches/issue39 ]]; then
            echo "Issue 39 transport already finalized."
            exit 0
          fi
          test "$(find .agent-patches/issue39 -type f -name 'part-[0-9][0-9]' | wc -l)" = "2"
          cat .agent-patches/issue39/part-[0-9][0-9] > /tmp/issue39.patch.gz.b64
          base64 --decode /tmp/issue39.patch.gz.b64 > /tmp/issue39.patch.gz
          gzip --decompress --stdout /tmp/issue39.patch.gz > /tmp/issue39.patch
          echo "c517f61da4d7b27e4cba52d1447af2552069ae8ef092b648fd7875676511820e  /tmp/issue39.patch" | sha256sum --check -
          git apply --check /tmp/issue39.patch
          git apply --index /tmp/issue39.patch
          git diff --cached --check
          node --check skills/issue-orchestration/scripts/lifecycle-observe-only-executor.mjs
          node --check tests/tools/issue-orchestration-lifecycle-observe-only-executor.test.mjs
          node --test --test-concurrency=1 tests/tools/issue-orchestration-lifecycle-observe-only-executor.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Execute observe-only lifecycle verification actions"
          CODE_COMMIT="$(git rev-parse HEAD)"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$CODE_COMMIT" node scripts/build-manifest.mjs
          git rm -r .agent-patches/issue39
          git rm .github/workflows/agent-apply-issue39.yml
          git add manifest.json
          git commit -m "Rebuild observe-only executor manifest"
          git push origin "HEAD:${TARGET_BRANCH}"
