name: export issue 67 source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: issue-67-verified-replay-cache
      - name: Create source archive
        run: git archive --format=zip --output=issue-67-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue-67-source
          path: issue-67-source.zip
          if-no-files-found: error
          retention-days: 1
