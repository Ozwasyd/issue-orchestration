name: Apply issue 42 terminalization patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [agent/issue-42-terminalization]
    paths:
      - .github/workflows/apply-issue42-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-42-terminalization' || github.ref_name == 'agent/issue-42-terminalization'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-42-terminalization

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .issue42-patch/part-* | base64 --decode | gzip --decompress > /tmp/issue42.patch
          test "$(sha256sum /tmp/issue42.patch | cut -d' ' -f1)" = "c3212530e79d1116774360fb178f91035c66d54399a2299a16472bf384871c4d"
          git apply --check /tmp/issue42.patch
          git apply --index /tmp/issue42.patch

      - name: Commit canonical issue 42 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .issue42-patch .github/workflows/apply-issue42-patch.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Execute terminalization from typed evidence"
          git push origin HEAD:agent/issue-42-terminalization
