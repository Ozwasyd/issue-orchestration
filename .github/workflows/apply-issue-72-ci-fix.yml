name: apply issue 72 CI fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-72-typed-actor-failure-isolation
      - name: Verify and apply fix
        shell: bash
        run: |
          set -euo pipefail
          echo '68a9d4b1a2b4b64f671a7b14461469db2b1dd411b6851a5c15aa671c24f08241  .github/issue-72-fix/part-00.b64' | sha256sum -c -
          echo '2ba4c7c36ae2974fcab00da2d27610ca9fa6ba88004047a0488d588b64877882  .github/issue-72-fix/part-01.b64' | sha256sum -c -
          echo '20879bd9e5119186a58b94c3aa5e61940a998ea336e72b5ceb9ecfa9e913777f  .github/issue-72-fix/part-02.b64' | sha256sum -c -
          cat .github/issue-72-fix/part-*.b64 > /tmp/issue72-fix.patch.gz.b64
          echo '7cd482542ee8ba9fb9b20b2970f2677430da912f6b61a4cca5191c9d877b2bde  /tmp/issue72-fix.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/issue72-fix.patch.gz.b64 > /tmp/issue72-fix.patch.gz
          echo 'f7b27960b7cfad6b191e5d469bd877875060753c52ff62a412dff9b21f3c824b  /tmp/issue72-fix.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue72-fix.patch.gz > /tmp/issue72-fix.patch
          echo '31297f7dd01408c9b9c202db9cd401d5d7386b2f163d7403877e98e947110593  /tmp/issue72-fix.patch' | sha256sum -c -
          git apply --check --binary /tmp/issue72-fix.patch
          git apply --binary /tmp/issue72-fix.patch
          rm -rf .github/issue-72-fix
          rm -f .github/workflows/apply-issue-72-ci-fix.yml
          git add -A
          git diff --cached --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete typed failure admission coverage (#72)'
          git push origin HEAD:issue-72-typed-actor-failure-isolation
