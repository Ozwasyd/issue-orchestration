name: Apply issue 21 implementation

on:
  push:
    branches:
      - agent/issue-21-canonical-route-authority

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-21-canonical-route-authority
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Apply implementation patch
        run: |
          base64 --decode .github/issue21.patch.gz.b64 | gzip --decompress > /tmp/issue21.patch
          git apply --index /tmp/issue21.patch

      - name: Install schema validator
        run: npm ci --prefix tools/test-matrix/schema-validator

      - name: Rebuild manifest
        run: node scripts/build-manifest.mjs

      - name: Run full offline acceptance suite
        run: |
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-*.test.mjs \
            tests/tools/issue-orchestration/*.test.mjs

      - name: Commit final branch tree
        run: |
          rm -f .github/issue21.patch.gz.b64 .github/workflows/apply-issue-21.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: derive actor validation from canonical routes'
          git push origin HEAD:agent/issue-21-canonical-route-authority

      - name: Report bootstrap status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=success
          if [ '${{ job.status }}' != 'success' ]; then
            state=failure
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"issue-21/bootstrap\",\"description\":\"Issue 21 branch preparation\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
