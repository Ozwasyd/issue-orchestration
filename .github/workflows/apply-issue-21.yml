name: Apply issue 21 verified change

on:
  push:
    branches:
      - agent/issue-21-route-authority

permissions:
  contents: write
  statuses: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_SHA: ${{ github.sha }}
      STATUS_CONTEXT: issue-21/bootstrap
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Apply audited change and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local sha="$1"
            local state="$2"
            local description="$3"
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              --data "$(jq -nc \
                --arg state "$state" \
                --arg context "$STATUS_CONTEXT" \
                --arg description "$description" \
                --arg target_url "$TARGET_URL" \
                '{state:$state,context:$context,description:$description,target_url:$target_url}')" \
              >/dev/null
          }

          on_exit() {
            local rc=$?
            if [[ $rc -ne 0 ]]; then
              post_status "$BOOTSTRAP_SHA" failure "Issue #21 offline verification failed" || true
            fi
          }
          trap on_exit EXIT

          post_status "$BOOTSTRAP_SHA" pending "Applying and verifying issue #21"

          : > /tmp/issue-21.patch.gz.b64
          for blob_sha in \
            ff092dd6edca3c7326145d2b8b6e608ac81b3229 \
            a73e6b119a55a59da8f10003a219e814e2b226b4 \
            cbbf93c8c89f3a1094db0fdceb8d893f048c2ad9 \
            3d23e358eace2231f8f59f36066c6133f2df18d4 \
            134e7de079b369b4159822d32596ae35d9f3aff8 \
            ad9f450419f9be25cac3358afe3fefe84aef1391 \
            f916eaf4d5d25507c83f2a42d2d4473168d03208
          do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs/${blob_sha}" \
              | jq -r '.content' \
              | base64 --decode \
              >> /tmp/issue-21.patch.gz.b64
          done

          base64 --decode /tmp/issue-21.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/issue-21.patch

          git apply --check /tmp/issue-21.patch
          git apply /tmp/issue-21.patch
          rm -f /tmp/issue-21.patch /tmp/issue-21.patch.gz.b64
          rm -f .github/workflows/apply-issue-21.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- manifest.json
          git commit -m "feat: bind actor validation to canonical routes"

          code_sha="$(git rev-parse HEAD)"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$code_sha" \
            node scripts/build-manifest.mjs
          git add manifest.json
          git commit -m "build: refresh route authority manifest"

          npm ci --prefix tools/test-matrix/schema-validator
          ISSUE_ORCHESTRATION_E2E_LIVE="" \
            node --test --test-concurrency=1 \
              tests/tools/issue-orchestration-*.test.mjs \
              tests/tools/issue-orchestration/*.test.mjs

          git diff --check
          test -z "$(git status --porcelain)"

          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:agent/issue-21-route-authority
          post_status "$BOOTSTRAP_SHA" success "Issue #21 offline verification passed"
          post_status "$final_sha" success "Issue #21 offline verification passed"
          trap - EXIT
