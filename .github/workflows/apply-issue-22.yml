name: Apply issue 22 audited change

on:
  push:
    branches:
      - agent/issue-22-deterministic-cold-start

permissions:
  contents: write
  statuses: write

env:
  BOOTSTRAP_SHA: ${{ github.sha }}

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Report pending verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n \
            --arg state pending \
            --arg context issue-22/bootstrap \
            --arg description 'Applying and verifying deterministic cold-start change' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${BOOTSTRAP_SHA}" \
            -d "${payload}"

      - name: Apply audited change and remove bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          compressed="${RUNNER_TEMP}/issue22.patch.gz"
          patch="${RUNNER_TEMP}/issue22.patch"
          : > "${compressed}"
          for sha in \
            475bd4d62cfba4f848bbdb0b6e5174ab70e144bc \
            bace21c64def19a9b54300c7309f11870294b1c5 \
            481feddb40c7541f42cc87a5494887bfc62b5b12 \
            1220a7d30e8cb788f1e296457cd73ce060751a75 \
            7412688a3608f731e68a041194098d346a29085f \
            1175a5781d1cbd5cce0a693b0ebcdb3b3270fd7d \
            ad1fe5dfbea4475fd73e3248fd6c49a5051cffa7 \
            4efac13bfcf31445f714d034cdd62dfeb82f27ff \
            25d38eceefa66746646ea21312930524d7237aa0 \
            6349e36876866c68d002d7e8ac74cfbaa7ba3c3c \
            51c49008bdd178c5ac1a283302e351394adc46c0
          do
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 -d >> "${compressed}"
          done
          echo '7b4ce207b37fd82aff0b21377159da62b2270dcced961d4d9110a862ec987d8a  '"${compressed}" | sha256sum --check
          gzip -dc "${compressed}" > "${patch}"
          echo '56fe344718c8794f463b622b732785e33b0d3c183ed92a89dbddb4fbe3175832  '"${patch}" | sha256sum --check
          git apply --check "${patch}"
          git apply "${patch}"
          rm -f .github/workflows/apply-issue-22.yml

          git config user.name 'issue-orchestration automation'
          git config user.email 'issue-orchestration@example.invalid'
          git add -A
          test ! -e .github/workflows/apply-issue-22.yml
          git diff --cached --check
          git commit -m 'feat: complete deterministic cold-start writer dispatch chain'
          code_sha="$(git rev-parse HEAD)"

          ISSUE_ORCHESTRATION_SOURCE_COMMIT="${code_sha}" node scripts/build-manifest.mjs
          git add manifest.json
          git diff --cached --check
          git commit -m 'chore: rebuild package manifest'

          npm ci --prefix tools/test-matrix/schema-validator
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-*.test.mjs \
            tests/tools/issue-orchestration/*.test.mjs

          git diff --exit-code
          test -z "$(git status --porcelain)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/issue-22-deterministic-cold-start

      - name: Report successful verification
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n \
            --arg state success \
            --arg context issue-22/bootstrap \
            --arg description 'Deterministic cold-start change passed full offline suite' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${BOOTSTRAP_SHA}" \
            -d "${payload}"

      - name: Report failed verification
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n \
            --arg state failure \
            --arg context issue-22/bootstrap \
            --arg description 'Deterministic cold-start verification failed' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${BOOTSTRAP_SHA}" \
            -d "${payload}"
