name: Apply issue 38 patch

on:
  push:
    branches:
      - agent/issue-38-writer-executor
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-issue-38
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/issue-38-writer-executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Apply verified patch and finalize branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -d .agent-patches/issue38 ]]; then
            echo "Issue 38 transport already finalized."
            exit 0
          fi
          test "$(find .agent-patches/issue38 -type f -name 'part-[0-9][0-9]' | wc -l)" = "13"
          cat .agent-patches/issue38/part-[0-9][0-9] > /tmp/issue38.patch.gz.b64
          base64 --decode /tmp/issue38.patch.gz.b64 > /tmp/issue38.patch.gz
          echo "cf8c7f28cb45ced54d94a3cc9fe70b9bb13b81190d779dd6df273424c19165b1  /tmp/issue38.patch.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/issue38.patch.gz > /tmp/issue38.patch
          echo "17738e7982fb50561ffb3fa1c076fee6abfacb467677ac49192c5cf586c6dcbc  /tmp/issue38.patch" | sha256sum --check -
          git apply --check --whitespace=error-all /tmp/issue38.patch
          git apply --index --whitespace=error-all /tmp/issue38.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Execute writer lifecycle actions through canonical runtime authority"
          CODE_COMMIT="$(git rev-parse HEAD)"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$CODE_COMMIT" node scripts/build-manifest.mjs
          git rm -r .agent-patches/issue38
          git rm .github/workflows/agent-apply-issue38.yml
          git add manifest.json
          git commit -m "Rebuild writer executor manifest"
          git push origin "HEAD:${TARGET_BRANCH}"
