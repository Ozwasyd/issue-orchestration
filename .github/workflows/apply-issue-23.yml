name: Apply issue 23 verified change

on:
  push:
    branches:
      - agent/issue-23-multi-node-ledgers

permissions:
  contents: write
  statuses: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_SHA: ${{ github.sha }}
      STATUS_CONTEXT: issue-23/bootstrap
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Apply audited change and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local sha="$1"
            local state="$2"
            local description="$3"
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              --data "$(jq -nc \
                --arg state "$state" \
                --arg context "$STATUS_CONTEXT" \
                --arg description "$description" \
                --arg target_url "$TARGET_URL" \
                '{state:$state,context:$context,description:$description,target_url:$target_url}')" \
              >/dev/null
          }

          on_exit() {
            local rc=$?
            if [[ $rc -ne 0 ]]; then
              post_status "$BOOTSTRAP_SHA" failure "Issue #23 offline verification failed" || true
            fi
          }
          trap on_exit EXIT

          post_status "$BOOTSTRAP_SHA" pending "Applying and verifying issue #23"

          : > /tmp/issue-23.patch.gz.b64
          for blob_sha in \
            602950b3fdaab4f061a1e63d9b743363e1b98e60 \
            b0c3739a3225a6e5bd906ef16b772aa2a1f588a1 \
            e1b6363fcddb116be79ff237221389995307815d \
            1d1b0a39130c4ad20be05096a96760b7561226f0 \
            47fa396a18c79a47ece88f8ca0821173e1725bb5 \
            d69f3b56b2faa187138c37d95b7fc10765644386 \
            8e036e9a69d889930ce7a82ce1204750b315dd22 \
            e8420afc6df2214b63671ca01a2947b6c4e58a80
          do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs/${blob_sha}" \
              | jq -r '.content' \
              | base64 --decode \
              >> /tmp/issue-23.patch.gz.b64
          done

          echo "10b22cd2b9f7c60c0e1dfa3ae0f7c40a96db65ac17d579579025aa2aefc03d56  /tmp/issue-23.patch.gz.b64" \
            | sha256sum --check

          base64 --decode /tmp/issue-23.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/issue-23.patch

          echo "e0a02425d19880bb8804227e3a49e5a696b54ad59dd76a190dc5441eb3bd677c  /tmp/issue-23.patch" \
            | sha256sum --check

          git apply --check /tmp/issue-23.patch
          git apply /tmp/issue-23.patch
          rm -f /tmp/issue-23.patch /tmp/issue-23.patch.gz.b64
          rm -f .github/workflows/apply-issue-23.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- manifest.json
          git commit -m "feat: split run control and node ledgers"

          code_sha="$(git rev-parse HEAD)"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$code_sha" \
            node scripts/build-manifest.mjs
          git add manifest.json
          git commit -m "build: refresh multi-node state manifest"

          npm ci --prefix tools/test-matrix/schema-validator
          ISSUE_ORCHESTRATION_E2E_LIVE="" \
            node --test --test-concurrency=1 \
              tests/tools/issue-orchestration-*.test.mjs \
              tests/tools/issue-orchestration/*.test.mjs

          git diff --check
          test -z "$(git status --porcelain)"

          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:agent/issue-23-multi-node-ledgers
          post_status "$BOOTSTRAP_SHA" success "Issue #23 offline verification passed"
          post_status "$final_sha" success "Issue #23 offline verification passed"
          trap - EXIT
