name: apply issue 66 fixture fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'issue-66-delta-aware-scope-refresh'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-66-delta-aware-scope-refresh
      - name: Verify and apply fixture fix
        shell: bash
        run: |
          set -euo pipefail
          echo '2cc775c31d9d03ef877f48207dde68fb9ae2d065ba7b3b6be75eb518e6cf7282  .github/issue-66-fix/patch.gz.b64' | sha256sum -c -
          base64 -d .github/issue-66-fix/patch.gz.b64 > /tmp/issue66-fix.patch.gz
          echo 'b9cc7e26a265dcc2f711ee704ffbdb4f01625739a1d2b7cf1dca39dfc366ad48  /tmp/issue66-fix.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue66-fix.patch.gz > /tmp/issue66-fix.patch
          echo '0645c8b8703f5a1b72a82ee63ec65a10a02023cac349ca32fefeb0e9bff54650  /tmp/issue66-fix.patch' | sha256sum -c -
          git apply --check --binary /tmp/issue66-fix.patch
          git apply --binary /tmp/issue66-fix.patch
          rm -rf .github/issue-66-fix
          rm -f .github/workflows/apply-issue-66-fixture-fix.yml
          git add -A
          git diff --cached --check
      - name: Commit fixture fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair canonical selector fixture (#66)'
          git push origin HEAD:issue-66-delta-aware-scope-refresh
