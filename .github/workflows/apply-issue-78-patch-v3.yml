name: apply issue 78 patch v3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-issue-78-patch-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'issue-78-model-pool-qualification'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-78-model-pool-qualification

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Install schema validator dependencies
        run: npm ci --prefix tools/test-matrix/schema-validator

      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'SUMS'
          94fc3e1daf9d5d7a45e7338882268d94a281614118502b63af48e04e56dba328  .github/issue-78-patch/chunk-00.b64
          325fca4e08a9a0b124ff1e600b077d38821fd842dbca2ecbf9d236a3e955e15d  .github/issue-78-patch/chunk-01a.b64
          8a0beb5ba1964453607e4c5306c5f23426ea763d77af4455dd2cdb928a4949f7  .github/issue-78-patch/chunk-01b.b64
          d6a7bf45408205df4f72261157cab4a07e13d79438284d368c42af0af94d0d2d  .github/issue-78-patch/chunk-01c.b64
          68bc70d2260638c32b497bff6ce027711103a21d006ebc55c030cf3dfac89dd3  .github/issue-78-patch/chunk-01d.b64
          15a751d8e71ed2480dc5484ce798bd18e36d0beeea6e773d7e10c3dda4141267  .github/issue-78-patch/chunk-02a.b64
          d11095329059d3c8d10263f3189d077b04991e0d006001bbabf5d3fd60a2387b  .github/issue-78-patch/chunk-02b.b64
          c46528981d4309eab3e994ec9038db515cda3a91fb43bfb5bc3197335e3cedd4  .github/issue-78-patch/chunk-02c.b64
          e4eeadcd29a82fe73bb0941b39be40ad7f25489c4567255ce6253fd062380426  .github/issue-78-patch/chunk-02d.b64
          b4c0e3321ba5d33d6925d0f34c28277956673daa41b4a99ceb37d6174280a082  .github/issue-78-patch/chunk-03a.b64
          db9464f4b4d24c3a80176ae6918e9208d3df3a05ccbcdbbee193866b98ae922d  .github/issue-78-patch/chunk-03b.b64
          31125d73bfdff9ac9c4adbade7164353548a3e0229c9ad5199a36745a7b9516f  .github/issue-78-patch/chunk-03c.b64
          ba9b42bb55abd07e295e23d4be6912bf76fd8c10d036d1c079b25243254f5428  .github/issue-78-patch/chunk-03d.b64
          388561a7fe4fd7d2c3810369bc12b0dc77b80d21bda4cb10f2975179cfb65bb4  .github/issue-78-patch/chunk-04.b64
          5420ffbadcb0654f92cb33cd40c69a5730fe6df380a4bb09fe0cf313642ac51f  .github/issue-78-patch/chunk-05a.b64
          29b562db13759a7965ab6b6c52dc4b83efc4803fd70933b80d7b96c149e80be7  .github/issue-78-patch/chunk-05b.b64
          96281fc8025e13ee551026e0634a167fdcfb03dfb8be32137fb75ae907020b5c  .github/issue-78-patch/chunk-05c.b64
          acdbcba3dab16000ff0e265a1e309979d14ab977d22a7da3ce1ec22c9ae303c8  .github/issue-78-patch/chunk-05d.b64
          11ecab309aedaf5c16850db8219214b022c2d314447c9e5d3c4cd1d04dd33aac  .github/issue-78-patch/chunk-05e.b64
          256f7fcb5fb8a9da0f15e6153b598375024316d08f2913f26103c7e590303788  .github/issue-78-patch/chunk-05f.b64
          269cd6894456a83fe9a8b1ca25732b2aa0a98ae188c638379c48243058d0b4c4  .github/issue-78-patch/chunk-05g.b64
          480edb57de62d498580ccf944155eeb58e60caab9e90085ff2eb00dfe28f857a  .github/issue-78-patch/chunk-05h.b64
          32284d640905e0a59327205fb45766490594d73765266b2bc85539fa4d90e70b  .github/issue-78-patch/chunk-06a.b64
          015dc3ff169529c1c4416a9ad3637026e7d47675ac5aa4fef8ef2f9d427fd977  .github/issue-78-patch/chunk-06b.b64
          ba93ae76986d882603fbad7227ad63eb70057ef409e1b394873d185b3fc3a09e  .github/issue-78-patch/chunk-06c.b64
          4f4a573a9c764d115248cee6943ee04fe0d80fd365f2d86d29dedf67d81fb88c  .github/issue-78-patch/chunk-06d.b64
          57e53888a2adaa24903297fd3e8480433b993a40b8d8fc7091ea9e4800dd2d17  .github/issue-78-patch/chunk-06e.b64
          6b0bf05529236fe36e12df1201f0e5d1dd5c93c6a5af29ed14b04816476cef11  .github/issue-78-patch/chunk-06f.b64
          05c7d2533718f782a8e7d47c6bb919ceff5cd0719e7fa9eb277a932edde60537  .github/issue-78-patch/chunk-06g.b64
          2bd1949ad1932eb7139f8284d95baac2f57e1313c207d4927bf203aaa6c092bd  .github/issue-78-patch/chunk-06h.b64
          SUMS

          cat \
            .github/issue-78-patch/chunk-00.b64 \
            .github/issue-78-patch/chunk-01{a,b,c,d}.b64 \
            .github/issue-78-patch/chunk-02{a,b,c,d}.b64 \
            .github/issue-78-patch/chunk-03{a,b,c,d}.b64 \
            .github/issue-78-patch/chunk-04.b64 \
            .github/issue-78-patch/chunk-05{a,b,c,d,e,f,g,h}.b64 \
            .github/issue-78-patch/chunk-06{a,b,c,d,e,f,g,h}.b64 \
            > /tmp/issue78.patch.gz.b64
          echo 'd75ac7ea1c1d55842837defb04dee0fbafc25caa03d9912edeb543a2af6e8dfe  /tmp/issue78.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/issue78.patch.gz.b64 > /tmp/issue78.patch.gz
          echo 'd5ff9897c701d6bff34fa4c8d7915385914c29f9ebe778e4c6fd610bd5679b21  /tmp/issue78.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue78.patch.gz > /tmp/issue78.patch
          echo '6f22f690f0617ffdd8905508109bdb721a374affbc73cb3bb7eda6f029b59812  /tmp/issue78.patch' | sha256sum -c -
          git apply --check /tmp/issue78.patch
          git apply /tmp/issue78.patch
          rm -rf .github/issue-78-patch
          rm -f .github/workflows/apply-issue-78-patch.yml
          rm -f .github/workflows/apply-issue-78-patch-v2.yml
          rm -f .github/workflows/apply-issue-78-patch-v3.yml

          BASE_COMMIT="$(git merge-base origin/main HEAD)"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$BASE_COMMIT" node scripts/build-manifest.mjs
          cp manifest.json /tmp/issue78-built-manifest.json
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$BASE_COMMIT" node scripts/build-manifest.mjs
          cmp /tmp/issue78-built-manifest.json manifest.json

          node --check scripts/model-pool-qualification.mjs
          node --check skills/issue-orchestration/scripts/model-pool-qualification.mjs
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-model-pool-qualification-static-guard.test.mjs \
            tests/tools/issue-orchestration-model-pool-qualification.test.mjs \
            tests/tools/issue-orchestration-model-qualification-receipt-schema.test.mjs \
            tests/tools/issue-orchestration-shared-package.test.mjs
          git add -A
          git diff --cached --check

      - name: Commit final issue 78 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add opt-in model-pool qualification command (#78)'
          git push origin HEAD:issue-78-model-pool-qualification
