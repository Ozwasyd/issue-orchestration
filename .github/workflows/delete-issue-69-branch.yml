name: delete merged issue 69 branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete:
    if: github.head_ref == 'issue-69-batch-actor-preparation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git --delete issue-69-batch-actor-preparation
