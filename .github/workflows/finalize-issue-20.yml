name: Finalize issue 20 clean tree

on:
  push:
    branches:
      - agent/issue-20-canonical-dag-gate

permissions:
  contents: write

concurrency:
  group: finalize-issue-20-clean-tree
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final fix and remove all staging files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/issue20-fix/payload.b64 > /tmp/issue20-fix.patch.gz
          echo '680190067f0b572c15ba3235a117b404e10ed3358e6d40277b347e5037683d7f  /tmp/issue20-fix.patch.gz' | sha256sum -c -
          gzip -d -c /tmp/issue20-fix.patch.gz > /tmp/issue20-fix.patch
          git apply /tmp/issue20-fix.patch
          rm -rf .github/issue20-fix
          rm -f .github/workflows/diagnose-issue-20.yml
          rm -f .github/workflows/finalize-issue-20.yml
          node scripts/build-manifest.mjs
          git add -A
          git diff --cached --check
          test ! -e .github/issue20-fix
          test ! -e .github/workflows/diagnose-issue-20.yml
          test ! -e .github/workflows/finalize-issue-20.yml

      - name: Commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve layered startup validation'
          git push origin HEAD:agent/issue-20-canonical-dag-gate
