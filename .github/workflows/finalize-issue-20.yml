name: Finalize issue 20 gate fix

on:
  push:
    branches:
      - agent/issue-20-canonical-dag-gate

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finalize-issue-20-gate-fix
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Apply, rebuild, and verify
        id: finalize
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a /tmp/issue20-finalize.log) 2>&1
          phase=decode
          trap 'code=$?; { echo "phase=$phase"; echo "exit_code=$code"; tail -n 120 /tmp/issue20-finalize.log; } > /tmp/issue20-finalize-report.txt; exit $code' ERR
          base64 -d .github/issue20-fix/payload.b64 > /tmp/issue20-fix.patch.gz
          echo '680190067f0b572c15ba3235a117b404e10ed3358e6d40277b347e5037683d7f  /tmp/issue20-fix.patch.gz' | sha256sum -c -
          gzip -d -c /tmp/issue20-fix.patch.gz > /tmp/issue20-fix.patch

          phase=apply
          git apply /tmp/issue20-fix.patch
          rm -rf .github/issue20-fix
          rm -f .github/workflows/diagnose-issue-20.yml
          rm -f .github/workflows/finalize-issue-20.yml

          phase=manifest
          node scripts/build-manifest.mjs
          git add -A
          git diff --cached --check
          test ! -e .github/issue20-fix
          test ! -e .github/workflows/diagnose-issue-20.yml
          test ! -e .github/workflows/finalize-issue-20.yml

          phase=npm
          npm ci --prefix tools/test-matrix/schema-validator --ignore-scripts

          phase=tests
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-*.test.mjs \
            tests/tools/issue-orchestration/*.test.mjs

          phase=complete
          printf 'phase=complete\nexit_code=0\n' > /tmp/issue20-finalize-report.txt

      - name: Report failed finalization
        if: steps.finalize.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/issue20-finalize-report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 28,
              body: `<!-- issue-20-finalize-diagnostic -->\n\n\`\`\`text\n${report}\n\`\`\``
            });

      - name: Stop after failed finalization
        if: steps.finalize.outcome == 'failure'
        run: exit 1

      - name: Commit verified final tree
        if: steps.finalize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve ready-frontier startup binding'
          git push origin HEAD:agent/issue-20-canonical-dag-gate
