name: Rebuild issue 35 manifest provenance

on:
  push:
    branches:
      - agent/issue-35-canonical-ledgers

permissions:
  contents: write

concurrency:
  group: rebuild-issue-35-manifest
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild manifest against the code-bearing commit
        shell: bash
        run: |
          set -euo pipefail
          marker=.agent-patches/issue35/rebuild-manifest
          if [[ ! -f "$marker" ]]; then
            echo "Manifest marker absent; nothing to do."
            exit 0
          fi
          source_commit="$(tr -d '\r\n' < "$marker")"
          test "$source_commit" = "fba032db5483594930115cb671942254eef99b7b"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$source_commit" node scripts/build-manifest.mjs
          git rm "$marker"
          git add manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebind issue 35 manifest provenance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
