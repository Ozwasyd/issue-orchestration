name: apply issue 76 patch

on:
  push:
    branches:
      - issue-76-actor-prompt-cache-identity
    paths:
      - .github/issue-76-patch/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-76-actor-prompt-cache-identity
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo '12c13d996083409ed0baf2b1c848cc80f0336a164f1858d386fbccab08f8c956  .github/issue-76-patch/part-00.b64' | sha256sum -c -
          echo '4720f56e061ba234717f346881cf007f3e894433c0043fc344a9fe56676264b8  .github/issue-76-patch/part-01.b64' | sha256sum -c -
          echo 'a508a1e9443c6b4be2d8b5596b5dcf8bbb457cc5b2876c00387ef6570e31bca3  .github/issue-76-patch/part-02.b64' | sha256sum -c -
          echo '62ec57e2e040c02ceae312370739c6b4810413a328e2cdeb63d3a178953f5043  .github/issue-76-patch/part-03.b64' | sha256sum -c -
          echo '22e77f03354e03ef6c352ea3f3a4b532172b631d993974e38ba7ea33e3bcecbe  .github/issue-76-patch/part-04.b64' | sha256sum -c -
          echo '909ceb2098f96002c44abae9b05b25791d9b4917b265a2cc9140d73c47897352  .github/issue-76-patch/part-05.b64' | sha256sum -c -
          echo '443e7c73df74d61d776c7157d8f5bbb8d93cdb751f0121d5aac73d99078c1f72  .github/issue-76-patch/part-06.b64' | sha256sum -c -
          echo 'ce9fef6a60c2b561708423141cf2a3add629d4cf8541b756384d836a9620c162  .github/issue-76-patch/part-07.b64' | sha256sum -c -
          echo '5dc5d7aa9cece1b551bef0512d6301986f15d52a255f06eee0b00783b22bbd21  .github/issue-76-patch/part-08.b64' | sha256sum -c -
          echo '4267102c4050e9e0fa27cbd5f3d2b426f40788462ae13db0198d8a3e6f3f3d58  .github/issue-76-patch/part-09.b64' | sha256sum -c -
          echo 'c0624464399c444fdf300b324b77205043c317364913360ef8d9fa2747377803  .github/issue-76-patch/part-10.b64' | sha256sum -c -
          cat .github/issue-76-patch/part-*.b64 > /tmp/issue76.patch.gz.b64
          echo '8e48261940c228eba13b189b25eff9d40c0ddb5749d2689d4786c03d41a24dc0  /tmp/issue76.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/issue76.patch.gz.b64 > /tmp/issue76.patch.gz
          echo 'a88368e4d3008b7405a006c657ec528a2eec7fccd3ee6afc13a58713d65b64cd  /tmp/issue76.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue76.patch.gz > /tmp/issue76.patch
          echo '07e260795c03795a4ad1af781c1efa5725a25c62f9f31b60ed4cf53fe5e00b07  /tmp/issue76.patch' | sha256sum -c -
          git apply --check --binary /tmp/issue76.patch
          git apply --binary /tmp/issue76.patch
          rm -rf .github/issue-76-patch
          rm -f .github/workflows/apply-issue-76-patch.yml
          git add -A
          git diff --cached --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stabilize actor prompt prefixes and cache identities (#76)'
          git push origin HEAD:issue-76-actor-prompt-cache-identity
