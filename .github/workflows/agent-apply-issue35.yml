name: Apply issue 35 patch

on:
  push:
    branches:
      - agent/issue-35-canonical-ledgers

permissions:
  contents: write

concurrency:
  group: apply-issue-35
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .agent-patches/issue35/apply ]]; then
            echo "Patch marker absent; nothing to do."
            exit 0
          fi
          cat .agent-patches/issue35/part-* > /tmp/issue35.patch.gz.b64
          base64 --decode /tmp/issue35.patch.gz.b64 > /tmp/issue35.patch.gz
          echo "e0323f3952b7500a170189425226a3997c8c112b2f6e37def991e9d1630980d2  /tmp/issue35.patch.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/issue35.patch.gz > /tmp/issue35.patch
          echo "640210687dcce2e53603e4b96536d2740160fb4c3d7e890557d4f8f0fec96653  /tmp/issue35.patch" | sha256sum --check -
          git apply --index --whitespace=error-all /tmp/issue35.patch
          git rm .agent-patches/issue35/apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make canonical ledgers the lifecycle authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
