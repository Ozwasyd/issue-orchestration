name: Delete merged issue 43 branch

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
    paths:
      - .github/workflows/delete-issue43-branch.yml

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-43-quiescence-finalization
      - name: Delete merged branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete agent/issue-43-quiescence-finalization
