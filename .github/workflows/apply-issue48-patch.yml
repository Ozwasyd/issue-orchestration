name: Apply issue 48 production dispatcher patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-48-production-dispatcher'
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/issue-48-production-dispatcher

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .issue48-patch/part-* | base64 --decode | gzip --decompress > /tmp/issue48.patch
          test "$(sha256sum /tmp/issue48.patch | cut -d' ' -f1)" = "6e40d636d81dcf6e8434730c67fc5485b38e3f3687d4d75b904bebbce4ae8103"
          git apply --check /tmp/issue48.patch
          git apply --index /tmp/issue48.patch

      - name: Commit canonical issue 48 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .issue48-patch .github/workflows/apply-issue48-patch.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dispatch lifecycle actions through one production loop"
          git push origin HEAD:agent/issue-48-production-dispatcher
