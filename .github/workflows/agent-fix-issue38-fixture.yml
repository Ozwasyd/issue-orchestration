name: Fix issue 38 fixture

on:
  push:
    branches:
      - agent/issue-38-writer-executor
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: fix-issue-38-fixture
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name == 'push' || github.head_ref == 'agent/issue-38-writer-executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Refresh frozen layered investigation fixture
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -f .agent-fix-issue38-fixture-trigger ]]; then
            echo "No fixture trigger present."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { existsSync, readFileSync, statSync, writeFileSync } from 'node:fs'
          import { resolve } from 'node:path'

          const root = process.cwd()
          const file = 'tests/fixtures/issue-orchestration/layered-investigation-test-contract.json'
          const contract = JSON.parse(readFileSync(file, 'utf8'))
          const oldDispatchDigest = 'cc4f13ca20ac7b7242e5019535134c82324912756152b566570de22f0e5ff8e1'
          const newDispatchDigest = '5d0bf9e8a853f2febca23ee7ca94414e0b2b476db903b17078c05add66934243'

          function sha256(value) {
            return createHash('sha256').update(value).digest('hex')
          }

          function canonical(value) {
            if (Array.isArray(value)) {
              return value
                .map(canonical)
                .sort((left, right) =>
                  JSON.stringify(left).localeCompare(JSON.stringify(right)))
            }
            if (!value || typeof value !== 'object') return value
            return Object.fromEntries(
              Object.keys(value).sort().map((key) => [key, canonical(value[key])]))
          }

          function digest(value) {
            return sha256(JSON.stringify(canonical(value)))
          }

          const dependency = contract.baseDependencyFiles.find((entry) =>
            entry.path === 'skills/issue-orchestration/scripts/dispatch-receipt.mjs')
          if (!dependency) throw new Error('dispatch-receipt dependency missing')
          if (dependency.sha256 !== oldDispatchDigest &&
              dependency.sha256 !== newDispatchDigest) {
            throw new Error(`unexpected dispatch digest ${dependency.sha256}`)
          }
          dependency.sha256 = newDispatchDigest

          const digestInput = structuredClone(contract)
          delete digestInput.contractDigest
          delete digestInput.candidateIdentity
          contract.contractDigest = digest(digestInput)

          const implementationFiles = contract.candidateIdentity.implementationFiles
            .map(({ path }) => {
              const absolute = resolve(root, path)
              if (!existsSync(absolute)) return { path, presence: 'missing' }
              return {
                path,
                presence: 'present',
                sha256: sha256(readFileSync(absolute)),
                gitMode: statSync(absolute).mode & 0o111 ? '100755' : '100644'
              }
            })
          contract.candidateIdentity.contractDigest = contract.contractDigest
          contract.candidateIdentity.implementationFiles = implementationFiles
          contract.candidateIdentity.candidateDigest = digest({
            baseSha: contract.base.sha,
            contractDigest: contract.contractDigest,
            matrixIdentityDigest: contract.matrixIdentityDigest,
            implementationFiles
          })

          writeFileSync(file, `${JSON.stringify(contract, null, 2)}\n`)
          NODE
          node --test --test-concurrency=1 tests/tools/issue-orchestration-layered-investigation.test.mjs
          git add tests/fixtures/issue-orchestration/layered-investigation-test-contract.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh layered investigation fixture for writer executor digest"
          CODE_COMMIT="$(git rev-parse HEAD)"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$CODE_COMMIT" node scripts/build-manifest.mjs
          git rm .agent-fix-issue38-fixture-trigger
          git rm .github/workflows/agent-fix-issue38-fixture.yml
          git add manifest.json
          git commit -m "Rebuild writer executor fixture manifest"
          git push origin "HEAD:${TARGET_BRANCH}"
