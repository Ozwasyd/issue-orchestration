name: Apply issue 24 lifecycle compiler

on:
  push:
    branches:
      - agent/issue-24-lifecycle-compiler

permissions:
  contents: write
  statuses: write

env:
  BOOTSTRAP_SHA: ${{ github.sha }}

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Report pending verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n \
            --arg state pending \
            --arg context issue-24/bootstrap \
            --arg description 'Applying and verifying lifecycle compiler' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${BOOTSTRAP_SHA}" \
            -d "${payload}"

      - name: Apply audited change and remove bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          compressed="${RUNNER_TEMP}/issue24.patch.gz"
          patch="${RUNNER_TEMP}/issue24.patch"
          : > "${compressed}"
          for sha in \
            68a97b82f74e93f5f197738231cf6f462453bb60 \
            ba404d83402005be4981921726fe0f79af1252f8 \
            ff89543f4bd8a1d508e768b4660e04a2807b4ceb \
            6e052e993679eefa95c54b791d776643e55a0b4c \
            e2332cfc10c1dc21d2f689b51cab3b819894c281 \
            c3d82d32548967ea026e4bda6bb2ec1b537eaf2a \
            26c49a8a68462832e3ca4b4569e405612a5d5c25
          do
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d >> "${compressed}"
          done
          echo '69c8e231648970684a1e8567fda1397fe1728f129e52de7527492cabdfa87f69  '"${compressed}" | sha256sum --check
          gzip -dc "${compressed}" > "${patch}"
          echo 'fe10d9635ac720f0ab465cff093c2039527df88dfd46a0dba19b1e98ad050011  '"${patch}" | sha256sum --check
          git apply --check "${patch}"
          git apply "${patch}"
          rm -f .github/workflows/apply-issue-24.yml

          git config user.name 'issue-orchestration automation'
          git config user.email 'issue-orchestration@example.invalid'
          git add -A
          test ! -e .github/workflows/apply-issue-24.yml
          git diff --cached --check
          git commit -m 'feat: add deterministic lifecycle transition compiler'
          code_sha="$(git rev-parse HEAD)"

          ISSUE_ORCHESTRATION_SOURCE_COMMIT="${code_sha}" node scripts/build-manifest.mjs
          git add manifest.json
          git diff --cached --check
          git commit -m 'chore: rebuild package manifest'

          npm ci --prefix tools/test-matrix/schema-validator
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-*.test.mjs \
            tests/tools/issue-orchestration/*.test.mjs

          git diff --exit-code
          test -z "$(git status --porcelain)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/issue-24-lifecycle-compiler

      - name: Report successful verification
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n \
            --arg state success \
            --arg context issue-24/bootstrap \
            --arg description 'Lifecycle compiler passed full offline suite' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${BOOTSTRAP_SHA}" \
            -d "${payload}"

      - name: Report failed verification
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n \
            --arg state failure \
            --arg context issue-24/bootstrap \
            --arg description 'Lifecycle compiler verification failed' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${BOOTSTRAP_SHA}" \
            -d "${payload}"
