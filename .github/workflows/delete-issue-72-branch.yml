name: delete merged issue 72 branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git --delete issue-72-typed-actor-failure-isolation
