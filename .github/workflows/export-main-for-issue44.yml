name: Export main for issue 44

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact main snapshot
        shell: bash
        run: |
          git archive --format=tar.gz --output=issue-orchestration-main-3b2f763.tar.gz origin/main
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: issue-orchestration-main-3b2f763
          path: issue-orchestration-main-3b2f763.tar.gz
          if-no-files-found: error
          retention-days: 1
