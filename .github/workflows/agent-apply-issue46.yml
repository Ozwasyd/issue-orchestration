name: Apply issue 46 patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-issue-46
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/issue-46-live-scope-base-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply verified patch and clean transport
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          jq -r '.pull_request.body' "$GITHUB_EVENT_PATH" \
            | sed -n '/^<!-- ISSUE46_PATCH_BEGIN -->$/,/^<!-- ISSUE46_PATCH_END -->$/p' \
            | sed '1d;$d' > /tmp/issue46.patch.gz.b64
          base64 --decode /tmp/issue46.patch.gz.b64 > /tmp/issue46.patch.gz
          echo "920164fe7b9730c4dc8a42f477d4746c066735dec623482bc81ca5df17fd838f  /tmp/issue46.patch.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/issue46.patch.gz > /tmp/issue46.patch
          echo "d3f666b4765657069209d25e74bdc5f3c4e05c6a99732272eb53d1b21ab7bf27  /tmp/issue46.patch" | sha256sum --check -
          git apply --index --whitespace=error-all /tmp/issue46.patch
          git rm .github/workflows/agent-apply-issue46.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh scope and bases from live observations"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$SOURCE_COMMIT" node scripts/build-manifest.mjs
          git add manifest.json
          git commit -m "Rebuild live refresh manifest"
          git push origin "HEAD:${TARGET_BRANCH}"
