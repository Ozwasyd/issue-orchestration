name: Apply issue 40 delivery executor patch

on:
  push:
    branches:
      - agent/issue-40-delivery-executor
    paths:
      - .github/workflows/apply-issue40-patch.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-40-delivery-executor' || github.ref_name == 'agent/issue-40-delivery-executor'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-40-delivery-executor

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .issue40-patch/part-* | base64 --decode | gzip --decompress > /tmp/issue40.patch
          test "$(sha256sum /tmp/issue40.patch | cut -d' ' -f1)" = "a3fe51e578d22dd87b0cdd998910b767a95a52091a55a899ebed66fb38dc26bb"
          git apply --check /tmp/issue40.patch
          git apply --index /tmp/issue40.patch

      - name: Commit canonical issue 40 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .issue40-patch .github/workflows/apply-issue40-patch.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Execute acceptance-group delivery exactly once"
          git push origin HEAD:agent/issue-40-delivery-executor
