name: apply issue 78 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-issue-78-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'issue-78-model-pool-qualification'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-78-model-pool-qualification

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Install schema validator dependencies
        run: npm ci --prefix tools/test-matrix/schema-validator

      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          echo '94fc3e1daf9d5d7a45e7338882268d94a281614118502b63af48e04e56dba328  .github/issue-78-patch/chunk-00.b64' | sha256sum -c -
          echo '325fca4e08a9a0b124ff1e600b077d38821fd842dbca2ecbf9d236a3e955e15d  .github/issue-78-patch/chunk-01a.b64' | sha256sum -c -
          echo '8a0beb5ba1964453607e4c5306c5f23426ea763d77af4455dd2cdb928a4949f7  .github/issue-78-patch/chunk-01b.b64' | sha256sum -c -
          echo 'd6a7bf45408205df4f72261157cab4a07e13d79438284d368c42af0af94d0d2d  .github/issue-78-patch/chunk-01c.b64' | sha256sum -c -
          echo '68bc70d2260638c32b497bff6ce027711103a21d006ebc55c030cf3dfac89dd3  .github/issue-78-patch/chunk-01d.b64' | sha256sum -c -
          echo 'fcf3af437989349028ee36ded358e5605a7bdb91d4ea1a39f17f54181312415d  .github/issue-78-patch/chunk-02.b64' | sha256sum -c -
          echo '2617655ed7e3dfa6808903798b4033f77e3d65c86d9f5853467054a4d67bb058  .github/issue-78-patch/chunk-03.b64' | sha256sum -c -
          echo '388561a7fe4fd7d2c3810369bc12b0dc77b80d21bda4cb10f2975179cfb65bb4  .github/issue-78-patch/chunk-04.b64' | sha256sum -c -
          echo 'd633e7523c6446e55a5479e3fe6f60329d35999242d19935f6b28e9b0f05049a  .github/issue-78-patch/chunk-05.b64' | sha256sum -c -
          echo 'd806af8c693a617307c0e32beef414b10c36ce3a704a3084db66c4cbf1f99f8e  .github/issue-78-patch/chunk-06.b64' | sha256sum -c -
          cat \
            .github/issue-78-patch/chunk-00.b64 \
            .github/issue-78-patch/chunk-01a.b64 \
            .github/issue-78-patch/chunk-01b.b64 \
            .github/issue-78-patch/chunk-01c.b64 \
            .github/issue-78-patch/chunk-01d.b64 \
            .github/issue-78-patch/chunk-02.b64 \
            .github/issue-78-patch/chunk-03.b64 \
            .github/issue-78-patch/chunk-04.b64 \
            .github/issue-78-patch/chunk-05.b64 \
            .github/issue-78-patch/chunk-06.b64 \
            > /tmp/issue78.patch.gz.b64
          echo 'd75ac7ea1c1d55842837defb04dee0fbafc25caa03d9912edeb543a2af6e8dfe  /tmp/issue78.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/issue78.patch.gz.b64 > /tmp/issue78.patch.gz
          echo 'd5ff9897c701d6bff34fa4c8d7915385914c29f9ebe778e4c6fd610bd5679b21  /tmp/issue78.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue78.patch.gz > /tmp/issue78.patch
          echo '6f22f690f0617ffdd8905508109bdb721a374affbc73cb3bb7eda6f029b59812  /tmp/issue78.patch' | sha256sum -c -
          git apply --check /tmp/issue78.patch
          git apply /tmp/issue78.patch
          rm -rf .github/issue-78-patch
          rm -f .github/workflows/apply-issue-78-patch.yml
          BASE_COMMIT="$(git merge-base origin/main HEAD)"
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$BASE_COMMIT" node scripts/build-manifest.mjs
          cp manifest.json /tmp/issue78-built-manifest.json
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$BASE_COMMIT" node scripts/build-manifest.mjs
          cmp /tmp/issue78-built-manifest.json manifest.json
          node --check scripts/model-pool-qualification.mjs
          node --check skills/issue-orchestration/scripts/model-pool-qualification.mjs
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-model-pool-qualification-static-guard.test.mjs \
            tests/tools/issue-orchestration-model-pool-qualification.test.mjs \
            tests/tools/issue-orchestration-model-qualification-receipt-schema.test.mjs \
            tests/tools/issue-orchestration-shared-package.test.mjs
          git add -A
          git diff --cached --check

      - name: Commit final issue 78 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add opt-in model-pool qualification command (#78)'
          git push origin HEAD:issue-78-model-pool-qualification
