name: Finalize issue 25 production authority

on:
  push:
    branches:
      - agent/issue-25-production-e2e-authority

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-25-production-e2e-authority
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Finalize source and source guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          harness_path = Path('tests/tools/issue-orchestration/multi-repository-lifecycle-e2e.mjs')
          harness = harness_path.read_text()
          broken = """                    pushes: Object.fromEntries(
                          Object.entries(repositories).map(
                              ([repoKey, repository]) => [
                                  repoKey, repository.pushCount
                              ]
                          )
                  }
              ])
          """
          fixed = """                    pushes: Object.fromEntries(
                          Object.entries(repositories).map(
                              ([repoKey, repository]) => [
                                  repoKey, repository.pushCount
                              ]
                          )
                      )
                  }
              ])
          """
          if broken not in harness:
              raise SystemExit('missing malformed remoteEffectsBefore block')
          harness_path.write_text(harness.replace(broken, fixed, 1))

          test_path = Path('tests/tools/issue-orchestration-multi-repository-lifecycle-e2e.test.mjs')
          source = test_path.read_text()
          start = source.index("test('issue 25 harness uses production APIs")
          replacement = r"""test('issue 25 harness uses production APIs and contains no fixture authority', () => {
              assert.match(runtimeSource, /resolveSelector/u)
              assert.match(runtimeSource, /createSemanticGraph/u)
              assert.match(runtimeSource, /createLifecycleRunLedger/u)
              assert.match(runtimeSource, /compileLifecycleRunActionSet/u)
              assert.match(runtimeSource, /recordLifecycleActionResults/u)
              assert.match(runtimeSource, /recordLifecycleScopeRefresh/u)
              assert.match(runtimeSource, /recordLifecycleBaseChange/u)
              assert.match(runtimeSource, /projectLifecycleRun/u)
              assert.doesNotMatch(
                  runtimeSource,
                  /tests\/fixtures|test-helper|fixture-only-constructor/iu
              )
              assert.doesNotMatch(
                  runtimeSource,
                  /sealReceipt|buildAggregateProjection|compileSelector\s*\(|scope-selector-receipt\.v1/iu
              )
              assert.doesNotMatch(
                  runtimeSource,
                  /https?:\/\/|curl\b|fetch\(|openai\b/iu
              )
              assert.doesNotMatch(
                  runtimeSource,
                  /setInterval|setTimeout|daemon|polling service/iu
              )
          })
          """
          test_path.write_text(source[:start] + replacement)
          PY

          rm -f .github/workflows/finalize-issue-25-authority.yml
          node --check skills/issue-orchestration/scripts/lifecycle-run-loop.mjs
          node --check tests/tools/issue-orchestration/multi-repository-lifecycle-e2e.mjs

          git config user.name 'issue-orchestration automation'
          git config user.email 'issue-orchestration@example.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce production authority in multi-repository E2E'
          code_sha="$(git rev-parse HEAD)"

          ISSUE_ORCHESTRATION_SOURCE_COMMIT="${code_sha}" node scripts/build-manifest.mjs
          git add manifest.json
          git diff --cached --check
          git commit -m 'chore: rebuild manifest for lifecycle run loop'

      - name: Install schema validator dependencies
        run: npm ci --prefix tools/test-matrix/schema-validator

      - name: Run targeted lifecycle acceptance
        run: |
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-lifecycle-transition.test.mjs \
            tests/tools/issue-orchestration-multi-repository-lifecycle-e2e.test.mjs

      - name: Run complete offline acceptance suite
        run: |
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-*.test.mjs \
            tests/tools/issue-orchestration/*.test.mjs

      - name: Verify committed tree is clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Push verified branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/issue-25-production-e2e-authority
