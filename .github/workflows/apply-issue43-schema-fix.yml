name: Apply issue 43 quiescence schema fix

on:
  pull_request:
    types:
      - ready_for_review
    branches:
      - main
    paths:
      - .github/workflows/apply-issue43-schema-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-43-quiescence-finalization

      - name: Reconstruct and validate fix
        shell: bash
        run: |
          set -euo pipefail
          cat .issue43-fix/part-* | base64 --decode | gzip --decompress > /tmp/issue43-schema-fix.patch
          test "$(sha256sum /tmp/issue43-schema-fix.patch | cut -d' ' -f1)" = "43b853a18861b9494c3961c2f3881d82019e6943bc2a6a9a610f85ba7ef1043f"
          git apply --check /tmp/issue43-schema-fix.patch
          git apply --index /tmp/issue43-schema-fix.patch

      - name: Commit canonical schema fix
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .issue43-fix .github/workflows/apply-issue43-schema-fix.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align quiescence receipt schema with machine evidence"
          git push origin HEAD:agent/issue-43-quiescence-finalization
