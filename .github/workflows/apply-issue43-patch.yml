name: Apply issue 43 quiescence finalization patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-issue43-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-43-quiescence-finalization

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .issue43-patch/part-* | base64 --decode | gzip --decompress > /tmp/issue43.patch
          test "$(sha256sum /tmp/issue43.patch | cut -d' ' -f1)" = "7b9763463f082e896cb2ce8ac2d6d298b41f08e4c5ea11fe48c4e2373e7c5c2c"
          git apply --check /tmp/issue43.patch
          git apply --index /tmp/issue43.patch

      - name: Commit canonical issue 43 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .issue43-patch .github/workflows/apply-issue43-patch.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize runs from fresh quiescence evidence"
          git push origin HEAD:agent/issue-43-quiescence-finalization
