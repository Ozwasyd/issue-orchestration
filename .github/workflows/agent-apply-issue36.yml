name: Finalize issue 36 branch

on:
  push:
    branches:
      - agent/issue-36-stage-receipt-admission
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: finalize-issue-36
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'push' || github.head_ref == 'agent/issue-36-stage-receipt-admission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Rebuild manifest and remove transport
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          SOURCE_COMMIT: 7d5a1955fadcb1d7d53a4924839d797da894cd07
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          test ! -e .agent-patches/issue36/apply
          test -f skills/issue-orchestration/scripts/lifecycle-stage-admission.mjs
          ISSUE_ORCHESTRATION_SOURCE_COMMIT="$SOURCE_COMMIT" node scripts/build-manifest.mjs
          git rm -r .agent-patches/issue36
          git rm .github/workflows/agent-apply-issue36.yml
          git add manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild lifecycle receipt manifest"
          git push origin "HEAD:${TARGET_BRANCH}"
