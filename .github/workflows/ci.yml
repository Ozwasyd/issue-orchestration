name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-acceptance:
    name: issue-orchestration / offline acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Install schema validator dependencies
        run: npm ci --prefix tools/test-matrix/schema-validator

      - name: Run complete offline acceptance suite
        run: |
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-*.test.mjs \
            tests/tools/issue-orchestration/*.test.mjs

      - name: Verify checkout remains unchanged
        if: always()
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  report-main-status:
    name: report main CI status
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: offline-acceptance
    runs-on: ubuntu-24.04
    permissions:
      statuses: write

    steps:
      - name: Publish offline acceptance result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.offline-acceptance.result }}
        shell: bash
        run: |
          if [[ "$RESULT" == "success" ]]; then
            state="success"
            description="Offline acceptance passed"
          else
            state="failure"
            description="Offline acceptance failed: $RESULT"
          fi

          payload=$(printf '{"state":"%s","context":"ci/offline-acceptance-result","description":"%s","target_url":"https://github.com/%s/actions/runs/%s"}' \
            "$state" "$description" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$payload"
