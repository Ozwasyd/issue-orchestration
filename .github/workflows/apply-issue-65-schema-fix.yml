name: apply issue 65 schema fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-65-repository-base-wave
      - name: Verify and apply schema fix
        shell: bash
        run: |
          set -euo pipefail
          echo '29487c5c374661735b895b8df8e346a683658e7c2af6879be98ea8aa7760cd96  .github/issue-65-schema-fix.b64' | sha256sum -c -
          base64 -d .github/issue-65-schema-fix.b64 > /tmp/issue65-schema-fix.patch.gz
          echo '6afa55769cff901ebe8a022511c4e029ec31fe155c00a0f6629b159367a31a3f  /tmp/issue65-schema-fix.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue65-schema-fix.patch.gz > /tmp/issue65-schema-fix.patch
          echo '9f5a5498b89301db9374adcb4e1fc1a1bf3a382994257113c4a4d01bc2a18656  /tmp/issue65-schema-fix.patch' | sha256sum -c -
          git apply --check --binary /tmp/issue65-schema-fix.patch
          git apply --binary /tmp/issue65-schema-fix.patch
          rm -f .github/issue-65-schema-fix.b64
          rm -f .github/workflows/apply-issue-65-schema-fix.yml
          git add -A
          git diff --cached --check
      - name: Commit schema fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix repository base epoch schema strict types (#65)'
          git push origin HEAD:issue-65-repository-base-wave
