name: Apply issue 41 cleanup closure patch

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/issue-41-cleanup-closure'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/issue-41-cleanup-closure

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .issue41-patch/part-* | base64 --decode | gzip --decompress > /tmp/issue41.patch
          test "$(sha256sum /tmp/issue41.patch | cut -d' ' -f1)" = "6d597c55e390d95d9f13cc4681d2fa769069caa22f118b9d9307e6a3e26a6255"
          git apply --check /tmp/issue41.patch
          git apply --index /tmp/issue41.patch

      - name: Commit canonical issue 41 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .issue41-patch .github/workflows/apply-issue41-patch.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Execute cleanup and issue closure canonically"
          git push origin HEAD:agent/issue-41-cleanup-closure
