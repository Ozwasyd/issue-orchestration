name: apply issue 67 patch

on:
  push:
    branches:
      - issue-67-verified-replay-cache
    paths:
      - .github/issue-67-patch/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-67-verified-replay-cache
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'fa2a9286538d3afaf8fd41f2b51df81b06ba6526709fce27767c3f81cdbe9600  .github/issue-67-patch/part-00.b64' | sha256sum -c -
          echo '516b5904925ddf93344ab6403256d3ad74d40d752aa4f023ec6e08841d64cee5  .github/issue-67-patch/part-01.b64' | sha256sum -c -
          echo '18fa6a8ffc20f56840920bbb3f78c6dc250744f1edcdf92a29a3d9acb71ecfa0  .github/issue-67-patch/part-02.b64' | sha256sum -c -
          echo '6cbb4c1e67d650a1fea9e3eb94bfe01d907e8a732a327a2b25b607d248da4ccb  .github/issue-67-patch/part-03.b64' | sha256sum -c -
          echo 'b3d00ea71a581a26ad08287afa7a95e9040416c275f4ae19a0f2aa7b7a34e5be  .github/issue-67-patch/part-04.b64' | sha256sum -c -
          echo '737fa99c79a004dae2a9db11d79c7cad9e1553bda7355c9dbe4486095e253e3e  .github/issue-67-patch/part-05.b64' | sha256sum -c -
          echo '03ff5be36b632902a4b72de9fe64b01536170d7adc7b880fc34d422d061db81a  .github/issue-67-patch/part-06.b64' | sha256sum -c -
          echo 'eb3ba18058ae3c53ea050ca9306348065b38d57fc240f0bc9de481e25ff44e27  .github/issue-67-patch/part-07.b64' | sha256sum -c -
          echo 'cf80dd3ae0ac4785864bd87f053eb8b4640d6006f62f26af2f0811a03ac6474e  .github/issue-67-patch/part-08.b64' | sha256sum -c -
          echo '5f728d99eae9617a9477509395efac7c823b35879df69fa1b45ca5bb4f715c97  .github/issue-67-patch/part-09.b64' | sha256sum -c -
          cat .github/issue-67-patch/part-*.b64 > /tmp/issue67.patch.gz.b64
          echo '89aeec91662b1dbb518579a5910b335422104242ec2e377c3225cc4f99ae78ae  /tmp/issue67.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/issue67.patch.gz.b64 > /tmp/issue67.patch.gz
          echo 'dabe3472fe106d6dc121375fcec84629b963bb24855ed28fcc70cdb3c4888464  /tmp/issue67.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue67.patch.gz > /tmp/issue67.patch
          echo '7d286827003b03aeedc42a57a0d1f8e4ad20873b7ca3f7879e19dd8b426ef9a4  /tmp/issue67.patch' | sha256sum -c -
          git apply --check --binary /tmp/issue67.patch
          git apply --binary /tmp/issue67.patch
          rm -rf .github/issue-67-patch
          rm -f .github/workflows/apply-issue-67-patch.yml
          git add -A
          git diff --cached --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reuse verified replay and aggregate projections (#67)'
          git push origin HEAD:issue-67-verified-replay-cache
