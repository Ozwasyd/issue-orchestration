name: apply issue 65 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-65-repository-base-wave
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo '73defbe1f9455506e0d966b7cab9b274ba59e86c57fb659307f128d369d11db4  .github/issue-65-patch/part-00.b64' | sha256sum -c -
          echo '924e75f87a0e6b6207d8debef0bed285fed40a16e07e4cef80a38021b5eb229f  .github/issue-65-patch/part-01.b64' | sha256sum -c -
          echo '7c6abe0f6d28340215a801c308f0e0f72e1638a46ccfbaecc822bcf203687367  .github/issue-65-patch/part-02.b64' | sha256sum -c -
          echo 'f206b37c86856df03c3fdc204adb6a34eae6d056e46867362f3d65526fa7fdda  .github/issue-65-patch/part-02b.b64' | sha256sum -c -
          echo 'de2f1dc143ad5b48a0f5198cb70b2aa5481b810f8aabc50d429b7f9e8d812f53  .github/issue-65-patch/part-03.b64' | sha256sum -c -
          echo '98e1f0ea7373658c5b9b8067235a9a233c5ec32eb326f68737b6a0048190247e  .github/issue-65-patch/part-03b.b64' | sha256sum -c -
          cat \
            .github/issue-65-patch/part-00.b64 \
            .github/issue-65-patch/part-01.b64 \
            .github/issue-65-patch/part-02.b64 \
            .github/issue-65-patch/part-02b.b64 \
            .github/issue-65-patch/part-03.b64 \
            .github/issue-65-patch/part-03b.b64 \
            | base64 -d > /tmp/issue65.patch.gz
          echo '8b39c268dd96e41ea02e937c6a940ee29c542c6eec4ed1f63b3d57a9563f3ccb  /tmp/issue65.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue65.patch.gz > /tmp/issue65.patch
          echo 'f0f9519d730d0955338e0133b60612d16e9d6640d4a52238a8785a0ff12334be  /tmp/issue65.patch' | sha256sum -c -
          git apply --check --binary /tmp/issue65.patch
          git apply --binary /tmp/issue65.patch
          rm -rf .github/issue-65-patch
          rm -f .github/workflows/apply-issue-65-patch.yml
          git add -A
          git diff --cached --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Share repository base observations by dispatcher wave (#65)'
          git push origin HEAD:issue-65-repository-base-wave
