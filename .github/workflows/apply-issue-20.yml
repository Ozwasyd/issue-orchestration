name: Apply issue 20 canonical DAG gate

on:
  push:
    branches:
      - agent/issue-20-canonical-dag-gate

permissions:
  contents: write

concurrency:
  group: apply-issue-20-canonical-dag-gate
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and verify change payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue20-payload/part-* > /tmp/issue20.patch.b64
          base64 -d /tmp/issue20.patch.b64 > /tmp/issue20.patch.gz
          echo '3919ac6b8a3b07d7ea7784ebadb74daa10d441dc2a327b68a1827496719e8676  /tmp/issue20.patch.gz' | sha256sum -c -
          gzip -d -c /tmp/issue20.patch.gz > /tmp/issue20.patch

      - name: Apply final issue change and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/issue20.patch
          rm -rf .github/issue20-payload
          rm -f .github/workflows/apply-issue-20.yml
          git add -A
          git diff --cached --check
          test ! -e .github/issue20-payload
          test ! -e .github/workflows/apply-issue-20.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/test-matrix/schema-validator/package-lock.json

      - name: Install schema validator dependencies
        run: npm ci --prefix tools/test-matrix/schema-validator --ignore-scripts

      - name: Run issue 20 regression suite
        run: |
          node --test --test-concurrency=1 \
            tests/tools/issue-orchestration-canonical-dag-gate.test.mjs \
            tests/tools/issue-orchestration-completed-prerequisite.test.mjs \
            tests/tools/issue-orchestration-semantic-runtime-projection.test.mjs \
            tests/tools/issue-orchestration-semantic-runtime-writer-projection.test.mjs \
            tests/tools/issue-orchestration-authority-v2-contract.test.mjs \
            tests/tools/issue-orchestration-dispatch-batch.test.mjs

      - name: Commit verified final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: canonicalize stage-aware DAG startup gate'
          git push origin HEAD:agent/issue-20-canonical-dag-gate
