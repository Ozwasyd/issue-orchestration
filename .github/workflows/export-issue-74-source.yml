name: export issue 74 source

on:
  push:
    branches:
      - issue-74-thin-actor-instructions

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create source archive
        run: git archive --format=zip --output=issue-74-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue-74-source
          path: issue-74-source.zip
          if-no-files-found: error
          retention-days: 1
