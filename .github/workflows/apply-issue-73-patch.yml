name: apply issue 73 patch

on:
  push:
    branches:
      - issue-73-actor-context-envelope
    paths:
      - .github/issue-73-patch/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-73-actor-context-envelope
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo '36eb828bc9a4fc675e80f90d853b78e7be8dc0c0f5e30a55c0b73fd13179820a  .github/issue-73-patch/part-00.b64' | sha256sum -c -
          echo '59c365232e271e793f7620d83c03cf8bfedda5397b9ade99b42ccfa2d90587b8  .github/issue-73-patch/part-01.b64' | sha256sum -c -
          echo '1f11959baa94cfc8200f8f372c61d3a16bca0baf44cebeafbc51fe8c958bcc35  .github/issue-73-patch/part-02.b64' | sha256sum -c -
          echo 'f1434b6642baaa229894545f2f5d85763c23f009336a90afbd065e6c6f878d97  .github/issue-73-patch/part-03.b64' | sha256sum -c -
          echo '086f7624b45c4adcededa63898485066bc3557d6cea9de7b59b9ca88402a8e88  .github/issue-73-patch/part-04.b64' | sha256sum -c -
          echo '629a011617e724a1ca1f846ec7ccd4335fe651cbaee6d7f0a0058dcb05e015c2  .github/issue-73-patch/part-05.b64' | sha256sum -c -
          echo 'b5c21a70abc7775e8eefa593192a3b4799894a3c9409210cddfbb2c71c79dfa6  .github/issue-73-patch/part-06.b64' | sha256sum -c -
          echo '4d75288d3dacf39a465f359d6129f789eb0e7e6f2dfefebc15354f7815307c3f  .github/issue-73-patch/part-07.b64' | sha256sum -c -
          echo '45c4662f8bc5b9f6498d8cc1f347dbca679a9869e021c87cb3232f0b489c9ca9  .github/issue-73-patch/part-08.b64' | sha256sum -c -
          echo 'e998b4acc478143afa593155db384f05c8e47ba54b6a7590189f9ae4a5ece5ad  .github/issue-73-patch/part-09.b64' | sha256sum -c -
          echo '18816ea0e538a4688017e630651b57b38d01f2f482a7f1599548cf606a9fa2a1  .github/issue-73-patch/part-10.b64' | sha256sum -c -
          cat .github/issue-73-patch/part-*.b64 > /tmp/issue73.patch.gz.b64
          echo 'f7ae03e04dd865d649df6511a2e556cc0f60c97560c622ea4c2e0f39cc8ca50d  /tmp/issue73.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/issue73.patch.gz.b64 > /tmp/issue73.patch.gz
          echo '69ea82449f6567870382924810b22d23b27ab31b9bab949d6f6e3c790fd43b36  /tmp/issue73.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue73.patch.gz > /tmp/issue73.patch
          echo '608d51c5b3c84d5a3b29cff34f16460e6ab284787ca9a50301c586f58ff2ae80  /tmp/issue73.patch' | sha256sum -c -
          git apply --check --binary /tmp/issue73.patch
          git apply --binary /tmp/issue73.patch
          rm -rf .github/issue-73-patch
          rm -f .github/workflows/apply-issue-73-patch.yml
          git add -A
          git diff --cached --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Compile stage-specific actor context envelopes (#73)'
          git push origin HEAD:issue-73-actor-context-envelope
